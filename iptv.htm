<!DOCTYPE html>
<html>

	<head>
		<title>电视直播</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.14/dist/hls.min.js"></script>
		<script>
			function status(text) {
				document.getElementById('status').textContent = text
			}

			function resolve(value, base, dir) {
				if (base.includes('{}') && !/^[a-z][a-z0-9+.-]*:\/\//i.test(value) && !value.startsWith('//')) {
					let url = base.replace('{}', value)
					return dir || value.endsWith('/') || !url.endsWith('/') ? url : url.slice(0, -1)
				}
				let template = value.includes('{}')
				let url = new URL(template ? value.replace(/\{\}/g, '%7B%7D') : value, base).href
				if (template) return url.replace(/%7B%7D/gi, '{}')
				return dir && !value.startsWith('?') && !url.endsWith('/') ? url + '/' : url
			}
			async function parseList(text, base, depth = 0, doc = base) {
				let items = [], title = null, prefix = base
				for (let line of text.split(/\r?\n/).map(s => s.trim())) {
					if (!line) continue
					if (/^#?BASE:/i.test(line)) {
						let value = line.substring(line.indexOf(':') + 1).trim()
						if (value) try { prefix = resolve(value, doc, true) } catch (err) { console.warn('无效基准：' + value, err) }
					} else if (/^#LOAD:/i.test(line)) {
						let target = line.substring(6).trim()
						if (target && depth < 2) try {
							let url = new URL(target, doc).href
							items.push(...await parseList(await fetchList(url), url, depth + 1, url))
						} catch (err) {
							console.warn('导入失败：' + target, err)
						}
					} else if (/^#?EXTINF:/i.test(line)) {
						title = line.substring(line.lastIndexOf(',') + 1).trim()
					} else if (!line.startsWith('#')) {
						if (title === null) {
							let comma = line.indexOf(',')
							if (comma > 0) [title, line] = [line.substring(0, comma).trim(), line.substring(comma + 1).trim()]
						}
						if (title && line && line !== '#genre#') {
							try {
								items.push({ title, url: resolve(line, prefix) })
							} catch (err) {
								console.warn('无效地址：' + line, err)
							}
						}
						title = null
					}
				}
				return items
			}
			function toggle() {
				let channel = document.getElementById('channel')
				let index = channel.selectedIndex
				let option = channel.options[index]
				if (!option || channel.disabled) return
				let url = option.value
				console.log("切换频道 " + option.text + "：" + url)
				localStorage['lastChannel:' + document.getElementById('source').selectedIndex] = index
				prep(url)
			}

			async function fetchList(uri) {
				let response = await fetch(uri, { cache: 'no-store' })
				if (!response.ok) throw new Error('加载失败: ' + response.status + ' ' + uri)
				return response.text()
			}

			async function change() {
				let source = document.getElementById('source'), index = source.selectedIndex
				if (index < 0 || source.disabled) return
				if (hls) hls.stopLoad()
				video.pause()
				localStorage.lastSource = index
				let uri = source.options[index].value
				let channel = document.getElementById('channel')
				channel.disabled = true
				channel.replaceChildren(new Option('加载中', ''))
				status('加载中…')
				try {
					let items = await parseList(await fetchList(uri), uri)
					if (source.value !== uri) return
					if (!items.length) throw new Error('播放列表为空')
					channel.replaceChildren(...items.map(item => new Option(item.title, item.url)))
					channel.disabled = false
					let last = Number(localStorage['lastChannel:' + index])
					if (Number.isInteger(last) && last >= 0 && last < items.length) channel.options[last].selected = true
					toggle()
				} catch (err) {
					if (source.value !== uri) return
					channel.disabled = true
					channel.replaceChildren(new Option('加载失败', ''))
					status('列表加载失败')
					console.error(err)
				}
			}
			async function load() {
				if (!init()) return
				let source = document.getElementById('source')
				try {
					let url = new URL('lists.txt', location.href).href
					let items = await parseList(await fetchList('lists.txt'), url)
					if (!items.length) throw new Error('来源列表为空')
					source.replaceChildren(...items.map(item => new Option(item.title, item.url)))
					let index = Number(location.search ? location.search.substring(1) : localStorage.lastSource)
					if (Number.isInteger(index) && index >= 0 && index < items.length) source.selectedIndex = index
					source.disabled = false
					await change()
				} catch (err) {
					source.replaceChildren(new Option('加载失败', ''))
					status('来源加载失败')
					console.error(err)
				}
			}
			let hls = null, video = null, retries = 0
			function init() {
				video = document.getElementById('video')
				video.addEventListener('playing', () => status('播放中'))
				video.addEventListener('pause', () => status('已暂停'))
				video.addEventListener('waiting', () => status('缓冲中…'))
				if (typeof Hls !== 'undefined' && Hls.isSupported()) {
					hls = new Hls()
					console.log('使用 HLS 播放')
					hls.attachMedia(video)
					hls.on(Hls.Events.MANIFEST_PARSED, play)
					hls.on(Hls.Events.ERROR, (event, data) => {
						console.error('播放错误:', data)
						if (!data.fatal) return
						if (retries++ >= 3) { status('播放失败，请切换频道或来源'); return }
						if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { status('重试中…'); hls.loadSource(hls.url) }
						else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); play() }
						else status('此频道无法播放')
					})
				}
				else if (video.canPlayType('application/vnd.apple.mpegurl')) {
					console.log('使用浏览器播放')
					video.addEventListener('loadedmetadata', play)
					video.addEventListener('error', () => status('此频道无法播放'))
				}
				else {
					status(typeof Hls === 'undefined' ? '播放器加载失败，请刷新' : '浏览器不支持数字电视')
					return false
				}
				return true
			}

			function prep(url) {
				retries = 0
				status('加载中…')
				if (hls) {
					hls.loadSource(url)
				} else {
					video.src = url
					video.load()
				}
			}

			function play() {
				video.play().then(() => {
					console.log('播放中...')
				}).catch(err => {
					if (err.name === 'AbortError') return
					status(err.name === 'NotAllowedError' ? '点击播放按钮开始播放' : '无法播放此频道')
					console.error('播放错误:', err)
				})
			}

			function keydown(e) {
				if (!/^(Enter|KeyM|KeyF|ArrowUp|ArrowDown)$/.test(e.code)) return
				e.preventDefault()
				if (e.code == 'Enter') {
					if (video.muted)
						video.muted = false
					else if (video.paused)
						play()
					else
						video.pause()
				} else if (e.code == 'KeyM') {
					video.muted = !video.muted
				} else if (e.code == 'KeyF') {
					if (!document.fullscreenElement)
						video.requestFullscreen()
					else
						document.exitFullscreen();
				} else if (e.code == 'ArrowUp' || e.code == 'ArrowDown') {
					let channel = document.getElementById('channel')
					let index = channel.selectedIndex
					let length = channel.options.length
					if (e.code == 'ArrowDown') {
						if (index < length - 1)
							index += 1
						else
							index = 0
					} else {
						if (index > 0)
							index -= 1
						else
							index = length - 1
					}
					channel.selectedIndex = index
					toggle()
				}
			}
		</script>
	</head>

	<body onload="load()" onkeydown="keydown(event)" style="margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; background:black">
		<video id="video" controls autoplay playsinline muted style="flex:1; min-height:0; width:100%; object-fit:contain">
		</video>
		<center>
			<select id="source" onchange="change()" disabled>
				<option>加载中</option>
			</select>
			<select id="channel" onchange="toggle()" disabled>
				<option>加载中</option>
			</select>
			<span id="status" role="status" style="color:white; font-size:13px"></span>
		</center>
	</body>

</html>
